<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Clothing Item Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
select {
    appearance: none;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCGTBj5H8XoKBobJQa9waJAkrJzcGpCLu4g0QS6yIpOqLON0MviUvKrCuhVNIQitCpB9JlK1u2He-xYbQ9QWmsQsD6TXPka-rQRnl2w8n-QcQoi_FchkzpOEbyVh56u8WyTY762b8WRRXSTibgjv9vLUDD5IQInwBcDTBllFPe3AqYxYs_S5mJzKVoxhy6zHNKqJuBsbTUuZqs6RAUzFUf7rc4v-RS8QW6CKW9uw3nFJ9m2VvVHlBhK1GeSIyKh-BZ3-9AU-Xd1fsOG);
    background-position: right 0.5rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em;
    padding-right: 2.5rem
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white min-h-screen flex justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-[480px] flex-col bg-white dark:bg-background-dark overflow-x-hidden shadow-xl">
<!-- TopAppBar -->
<div class="sticky top-0 z-10 flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-100 dark:border-gray-800">
<div class="flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Edit Item</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center rounded-lg h-12 bg-transparent text-[#111418] dark:text-white">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</div>
<div class="flex-1 overflow-y-auto pb-32">
<!-- HeaderImage -->
<div class="@container px-4 py-4">
<div class="relative w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-80 shadow-sm border border-gray-100 dark:border-gray-800" data-alt="Modern navy blue wool blend coat" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDcwX_bQUYR5Kwz4CibqVTwbCT95LAmQ1rXjA-UleLPNmV19aNIaTV7pft55OhaM4_5bWBGDu4mgsmKeYeVxOYzaMzeBS8QImf5qaDzsxr3JjBK5SEL6eL7oNaKtD7UlK2qMTmMrU8xoVJEBaZQG5ajSDIO_XhEWX6Wihq2ViPbnHJHLgrD_SRhRBLrdhJ4mBTyx4ABD3FeH2eS8TGSkCPnvsw2hTsFgusdYifNmdxWk92XwzmoGt-KnUMkErk8-XU7laQxnRQ969yv");'>
<div class="absolute bottom-4 right-4">
<button class="bg-white/90 dark:bg-black/70 backdrop-blur-md p-2 rounded-full shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary">photo_camera</span>
</button>
</div>
</div>
</div>
<!-- Category Section -->
<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 px-4 pt-6 pb-2">Category</h3>
<div class="px-4 py-2">
<label class="flex flex-col w-full">
<select class="form-input flex w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 h-14 px-4 text-base focus:ring-2 focus:ring-primary focus:border-primary">
<option value="tops">Tops</option>
<option value="bottoms">Bottoms</option>
<option selected="" value="outerwear">Outerwear</option>
<option value="dresses">Dresses</option>
<option value="shoes">Shoes</option>
<option value="accessories">Accessories</option>
</select>
</label>
</div>
</div>
<!-- Color Section -->
<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 px-4 pt-6 pb-2">Color</h3>
<div class="px-4 py-2 flex flex-wrap gap-3">
<button class="w-10 h-10 rounded-full border-2 border-primary ring-2 ring-primary/20 bg-[#1e293b]" title="Navy Blue"></button>
<button class="w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 bg-black" title="Black"></button>
<button class="w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 bg-white" title="White"></button>
<button class="w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 bg-[#78350f]" title="Brown"></button>
<button class="w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 bg-[#d1d5db]" title="Gray"></button>
<button class="w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 bg-[#991b1b]" title="Red"></button>
<button class="w-10 h-10 rounded-full border border-gray-200 dark:border-gray-700 bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-gray-400 text-sm">palette</span>
</button>
</div>
</div>
<!-- Seasonality Section -->
<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 px-4 pt-6 pb-2">Seasonality</h3>
<div class="px-4 py-2 flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm font-medium">Spring</button>
<button class="px-4 py-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm font-medium">Summer</button>
<button class="px-4 py-2 rounded-full bg-primary text-white text-sm font-semibold shadow-md">Autumn</button>
<button class="px-4 py-2 rounded-full bg-primary text-white text-sm font-semibold shadow-md">Winter</button>
</div>
</div>
<!-- Notes Section (Optional enhancement) -->
<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 px-4 pt-6 pb-2">Notes</h3>
<div class="px-4 py-2">
<textarea class="form-input w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-4 py-3 text-base focus:ring-2 focus:ring-primary focus:border-primary min-h-[100px]" placeholder="Add details about fit, brand, or care instructions...">Heavy wool blend, fits slightly oversized. Dry clean only.</textarea>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="fixed bottom-0 w-full max-w-[480px] bg-white/80 dark:bg-background-dark/80 backdrop-blur-xl border-t border-gray-100 dark:border-gray-800 p-4 space-y-3">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform">
                Save Changes
            </button>
<button class="w-full text-red-500 font-semibold py-2 active:opacity-60 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">delete</span>
                Delete Item
            </button>
<!-- Bottom safe area padding for iOS -->
<div class="h-4"></div>
</div>
</div>
</body></html>
