<span class="text-[10px] font-bold text-primary uppercase tracking-wider">AI Detected</span>
</div>
</div>
</div>

<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-[#f0f2f4] dark:bg-gray-800 px-5 cursor-pointer border border-transparent hover:border-gray-300">

<label class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Brand</label>
<div class="relative">
<input class="w-full h-12 bg-[#f0f2f4] dark:bg-gray-800 border-none rounded-xl px-4 text-sm focus:ring-2 focus:ring-primary outline-none text-[#111418] dark:text-white" placeholder="Enter brand name" type="text" value="Uniqlo"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-400 text-xl">search</span>
</div>
</div>
<div class="flex flex-col gap-2">
