<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clothing Item Camera Capture</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .camera-overlay {
            background: linear-gradient(to bottom, rgba(16, 24, 34, 0.8) 0%, rgba(16, 24, 34, 0) 20%, rgba(16, 24, 34, 0) 80%, rgba(16, 24, 34, 0.9) 100%);
        }
        .silhouette-path {
            stroke-dasharray: 8 8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<div class="relative h-screen w-full max-w-[480px] mx-auto overflow-hidden bg-black">
<!-- Live Camera Viewfinder (Simulated) -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="high quality neutral background for clothing photography" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAXrnIB5m41ujq05l-nUYKJu-mP32a87lMIwyGPfGaEajQlbrA2YvODMMeD3RUmmseamKeeekNnbPeJMYJyzltM1XpOCBkNeD05r4LNoj2qjpPVoeZ4VGflAlwA2U9JF-MBVXslyZciV_thBH-BRsD9GeE507GfQyv4RXIMtUIKvwZ5dgO-jhp5sAUxuTEoBaVmAgQF13TBxqMEv_9tCVTZ2yU_21_zXC6pxYvX1jgOUnB0rkaDqO_gd71Xd0MGmCuHl0_zuM-jEkfK');">
</div>
<!-- Camera Overlay (Gradient and Controls) -->
<div class="absolute inset-0 z-10 flex flex-col justify-between camera-overlay">
<!-- Top App Bar Area -->
<div class="flex items-center justify-between p-6 pt-12">
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-4">
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined">flash_auto</span>
</button>
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Central Silhouette Guide (Empty State Style) -->
<div class="flex-1 flex flex-col items-center justify-center px-8">
<div class="w-full aspect-[3/4] flex flex-col items-center justify-center border-2 border-dashed border-white/40 rounded-xl relative">
<!-- SVG Silhouette of a T-shirt -->
<svg class="w-2/3 h-2/3 text-white/20" fill="none" stroke="currentColor" stroke-width="1" viewbox="0 0 24 24">
<path class="silhouette-path" d="M6 4L4 7V20H20V7L18 4H15C15 5.65685 13.6569 7 12 7C10.3431 7 9 5.65685 9 4H6Z"></path>
</svg>
<!-- Guidance Text -->
<div class="absolute bottom-10 left-0 right-0 text-center px-4">
<p class="text-white text-sm font-medium drop-shadow-md">Align item within the silhouette</p>
<p class="text-white/70 text-xs mt-1">Make sure lighting is even</p>
</div>
<!-- Focus Reticle (Simulated) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 size-20 border border-primary/60 rounded-sm">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-0.5 h-2 bg-primary/60"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0.5 h-2 bg-primary/60"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-2 h-0.5 bg-primary/60"></div>
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-0.5 bg-primary/60"></div>
</div>
</div>
</div>
<!-- Bottom Controls -->
<div class="pb-12 px-6 flex flex-col gap-6 items-center">
<!-- Tabs / Mode Switcher -->
<div class="flex items-center gap-8 overflow-x-auto no-scrollbar py-2">
<button class="flex flex-col items-center gap-1 shrink-0">
<span class="text-xs font-bold uppercase tracking-widest text-white/50">Model</span>
</button>
<button class="flex flex-col items-center gap-1 shrink-0">
<span class="text-xs font-bold uppercase tracking-widest text-primary">Flat Lay</span>
<div class="size-1.5 bg-primary rounded-full"></div>
</button>
<button class="flex flex-col items-center gap-1 shrink-0">
<span class="text-xs font-bold uppercase tracking-widest text-white/50">Hanger</span>
</button>
</div>
<!-- Camera Main Controls -->
<div class="flex items-center justify-between w-full max-w-sm">
<!-- Gallery Preview -->
<div class="size-12 rounded-lg border-2 border-white/20 overflow-hidden bg-zinc-800 shrink-0">
<img class="w-full h-full object-cover" data-alt="thumbnail preview of previous clothing item" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz87Rolo83v127zvlfCyK052B6p_-zf9Q-VlHuKWk5oXLToH2gyZh-HfiHqs_nx92jbubG8y9cMlkgPxcrS4aImOuYW-99USw71sceoEOtaBp4r52i3fUhQnXyVyAZp08Tuk-_sPofNalB0YIPVaGy6WiiKSc5Tscw_tgb16s8_LVdZGsfmpjrcImMR511aswm3r9TW-HEKU0kVC0zlnP1PeKyz4M2ilQhsjXz2aXVKki8l3G0QL-hfhNLw71FrAFH_jKCZO2UbAcg"/>
</div>
<!-- Shutter Button -->
<button class="relative size-20 flex items-center justify-center rounded-full border-4 border-white shrink-0 group">
<div class="size-[70%] bg-white rounded-full group-active:scale-90 transition-transform"></div>
</button>
<!-- Lens Switch / Flip -->
<button class="size-12 rounded-full bg-white/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined">cached</span>
</button>
</div>
<!-- Home Indicator (iOS style) -->
<div class="w-32 h-1 bg-white/30 rounded-full mt-4"></div>
</div>
</div>
</div>
</body></html>
